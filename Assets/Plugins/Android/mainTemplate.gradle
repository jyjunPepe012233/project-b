apply plugin: 'com.android.library'
**APPLY_PLUGINS**

// 프로젝트에서 안드로이드 sdk 버전을 수정하고 싶으면 Unity Player Setting와 함께 이 변수를 조작해야 함
// (Android 빌드는 Gradle이 최종 빌드 프로세스임)
def CONST_MIN_SDK_VERSION = 24
def CONST_TARGET_SDK_VERSION = 34

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
// Android Resolver Dependencies Start
    implementation 'com.google.android.gms:play-services-base:18.10.0' // Assets/Firebase/Editor/AppDependencies.xml:20
    implementation 'com.google.firebase:firebase-analytics:23.2.0' // Assets/Firebase/Editor/CrashlyticsDependencies.xml:18
    implementation 'com.google.firebase:firebase-app-unity:13.10.0' // Assets/Firebase/Editor/AppDependencies.xml:25
    implementation 'com.google.firebase:firebase-common:22.0.1' // Assets/Firebase/Editor/AppDependencies.xml:16
    implementation 'com.google.firebase:firebase-crashlytics-ndk:20.0.5' // Assets/Firebase/Editor/CrashlyticsDependencies.xml:16 targetSdkVersion이 ProejctSettings와 다른 값으로 빌드되는 문제를 디버깅 중임.
    implementation 'com.google.firebase:firebase-crashlytics-unity:13.10.0' // Assets/Firebase/Editor/CrashlyticsDependencies.xml:23
// Android Resolver Dependencies End
**DEPS**}

// Android Resolver Exclusions Start
android {
  packagingOptions {
      exclude ('/lib/arm64-v8a/*' + '*')
      exclude ('/lib/armeabi/*' + '*')
      exclude ('/lib/mips/*' + '*')
      exclude ('/lib/mips64/*' + '*')
      exclude ('/lib/x86/*' + '*')
      exclude ('/lib/x86_64/*' + '*')
  }
}
// Android Resolver Exclusions End
android {
    namespace "com.unity3d.player"
    ndkPath "**NDKPATH**"
    compileSdkVersion **APIVERSION**
    buildToolsVersion '**BUILDTOOLS**'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdkVersion CONST_MIN_SDK_VERSION
        targetSdkVersion CONST_TARGET_SDK_VERSION
        ndk {
            abiFilters **ABIFILTERS**
        }
        versionCode **VERSIONCODE**
        versionName '**VERSIONNAME**'
        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
    }

    lintOptions {
        abortOnError false
    }

    aaptOptions {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**PACKAGING_OPTIONS**
}

// Firebase androidlib에 들어있는 패키지가 2019 Unity에서 쓰던 sdk version을 사용하려고 본 설정 파일의 defaultConfig를 무시하고
// targetSdkVersion을 9로 강제하는 문제가 있음 (Firebase의 고질적 문제)
// 아래 처리를 통해 Firebase androidlib를 포함한 모든 안드로이드 하위 모듈(subProject)을 탐색하여 apiLevel이 n보다 낮으면 n으로 만들어버리는 처리
// subprojects { subproject ->
//     afterEvaluate {
//         if (subproject.hasProperty("android")) {
//             subproject.android {
//                 if (defaultConfig.targetSdkVersion.apiLevel < CONST_TARGET_SDK_VERSION) {
//                     defaultConfig {
//                         minSdkVersion CONST_MIN_SDK_VERSION
//                         targetSdkVersion CONST_TARGET_SDK_VERSION
//                     }
//                 }
//             }
//         }
//     }
// } ------- 갑자기 위 문제(targetSdkVersion 0 덮어씌워짐)가 사라져서 주석처리해놓음.
**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**
